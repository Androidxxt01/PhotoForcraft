name: Android APK (editor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Instalar cargo-apk
        run: cargo install cargo-apk --locked

      - name: Instalar plataforma Android 33
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;34.0.0"

      - name: Gerar chave de assinatura
        run: |
          keytool -genkeypair \
            -keystore "$HOME/release.keystore" \
            -storepass android \
            -keypass android \
            -alias poc \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PhotoCraft"

      - name: Build APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release -p photocraft-android

      - uses: actions/upload-artifact@v4
        with:
          name: photocraft-android-apk
          path: target/release/apk/*.apk
